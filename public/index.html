<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-row">
        <div>
          <h1>Task Manager</h1>
          <p>Agrega y organiza tus tareas</p>
        </div>
        <button type="button" id="btnLogout" class="btn-logout hidden">Cerrar sesión</button>
      </div>
    </header>

    <section id="authSection" class="card auth-card">
      <div class="auth-tabs">
        <button type="button" id="tabLogin" class="active">Iniciar sesión</button>
        <button type="button" id="tabRegister">Registrarse</button>
      </div>
      <form id="authForm">
        <div class="form-row">
          <label for="authEmail">Correo</label>
          <input type="email" id="authEmail" required placeholder="tu@correo.com" autocomplete="email" />
        </div>
        <div class="form-row">
          <label for="authPassword">Contraseña</label>
          <input type="password" id="authPassword" required placeholder="••••••••" autocomplete="current-password" />
        </div>
        <p id="authError" class="error" style="display: none;"></p>
        <button type="submit" id="btnAuth" class="btn btn-primary">Iniciar sesión</button>
      </form>
    </section>

    <!-- Tasks (shown when logged in) -->
    <section id="tasksSection" class="hidden">
      <div class="card">
        <div class="add-row">
          <input type="text" id="newTask" placeholder="¿Qué hay que hacer?" autocomplete="off" />
          <button type="button" id="btnAdd" class="btn btn-primary">Agregar</button>
        </div>
        <p id="error" class="error" style="display: none;"></p>
        <ul id="taskList" class="task-list"></ul>
        <div id="emptyMsg" class="empty-state" style="display: none;">
          <div class="icon">📋</div>
          <p>No hay tareas.<br>Agrega una arriba para empezar.</p>
        </div>
      </div>
    </section>
  </div>

  <script>window.PRODUCTION_API_URL = 'https://frontendpractica5.onrender.com';</script>
  <script src="app.js"></script>
</body>
</html>
